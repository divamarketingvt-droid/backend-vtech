<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Blog Admin Login | Verifitech</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #1ac2c1; --primary-dark: #16a8a7; --primary-light: #e0f7f7; --dark: #0f172a; --gray: #64748b; }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: "Inter", sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: radial-gradient(circle at 20% 20%, var(--primary-light), #f8fafc 60%); color: var(--dark); }
    .card { width: 100%; max-width: 400px; background: #fff; border-radius: 20px; padding: 2.5rem 2rem;
            box-shadow: 0 20px 60px rgba(15, 23, 42, .12); }
    .logo { width: 56px; height: 56px; border-radius: 16px; background: var(--primary); color: #fff; display: grid;
            place-items: center; font-size: 1.6rem; margin: 0 auto 1rem; }
    h1 { font-size: 1.5rem; text-align: center; font-weight: 800; }
    .sub { text-align: center; color: var(--gray); font-size: .92rem; margin: .35rem 0 1.75rem; }
    label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: .4rem; }
    .field { position: relative; margin-bottom: 1.1rem; }
    .field i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray); }
    input { width: 100%; padding: .8rem .9rem .8rem 2.6rem; border: 2px solid #e2e8f0; border-radius: 12px; font: inherit; }
    input:focus { outline: none; border-color: var(--primary); }
    button { width: 100%; padding: .9rem; border: 0; border-radius: 12px; background: var(--primary); color: #fff;
             font: inherit; font-weight: 700; cursor: pointer; margin-top: .5rem; }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: .6; cursor: wait; }
    .error { display: none; background: #fef2f2; color: #b91c1c; border-radius: 10px; padding: .7rem .9rem; font-size: .88rem; margin-bottom: 1rem; }
    .back { display: block; text-align: center; margin-top: 1.25rem; color: var(--gray); font-size: .85rem; text-decoration: none; }
  </style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="logo"><i class="bi bi-journal-richtext"></i></div>
    <h1>Blog Admin</h1>
    <p class="sub">Sign in to create and manage blog posts</p>
    <div class="error" id="error"></div>
    <label for="username">Username</label>
    <div class="field"><i class="bi bi-person"></i><input id="username" name="username" required autocomplete="username" autofocus></div>
    <label for="password">Password</label>
    <div class="field"><i class="bi bi-lock"></i><input id="password" name="password" type="password" required autocomplete="current-password"></div>
    <button type="submit" id="btn">Sign in</button>
    <a class="back" href="/resources/blog">← Back to blog</a>
  </form>

  <script>
    // The username/password are encrypted in the browser with a one-time
    // RSA-OAEP key from the server, so the request never contains them as plain text.
    const b64ToBytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const bytesToB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

    async function encryptCredentials(username, password) {
      if (!window.crypto || !crypto.subtle) {
        throw new Error('Secure login needs HTTPS. Open this page with https:// (or on localhost).');
      }
      const res = await fetch('/api/blog-admin/login-key', { cache: 'no-store', credentials: 'same-origin' });
      const key = await res.json();
      if (!key.success) throw new Error('Could not start secure login');
      const publicKey = await crypto.subtle.importKey(
        'spki', b64ToBytes(key.publicKey), { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
      const plain = new TextEncoder().encode(JSON.stringify({ u: username, p: password, n: key.nonce }));
      const cipher = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, publicKey, plain);
      return bytesToB64(cipher);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('error');
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (password.length > 100) throw new Error('Password is too long');
        const payload = await encryptCredentials(username, password);
        const res = await fetch('/api/blog-admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ payload })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || 'Login failed');
        document.getElementById('password').value = '';
        location.href = '/blog-admin';
      } catch (ex) {
        err.textContent = ex.message; err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
